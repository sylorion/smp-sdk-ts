type Query {
  organizationContact(contactID: ID!, callerUserID: ID @deprecated(reason: "Ignoré : l'appelant est l'identité signée de la requête.")): OrganizationContact
  organizationContacts(
    organizationID: ID!
    callerUserID: ID @deprecated(reason: "Ignoré : l'appelant est l'identité signée de la requête.")
    search: String
    status: OrgContactStatus
    source: OrgContactSource
    page: Int
    pageSize: Int

    """Responsable : `me`, `unassigned` ou l'identifiant d'un membre."""
    assignee: String
  ): [OrganizationContact!]!
  organizationContactsSummary(organizationID: ID!): OrganizationContactsSummary!
  searchOrganizationContacts(organizationID: ID!, query: String!, callerUserID: ID @deprecated(reason: "Ignoré : l'appelant est l'identité signée de la requête."), limit: Int): [OrganizationContact!]!
  organizationDocumentSettings(organizationID: ID!): OrganizationDocumentSettings!
  organizationDocumentPresentation(organizationID: ID!): OrganizationDocumentPresentation!

  """Historique des envois (50 derniers)."""
  organizationMailings(organizationID: ID!): [OrganizationMailing!]!

  """
  Dernier e-mail envoyé à chaque contact visible (colonne « Dernier échange »).
  """
  organizationContactsLastMailed(organizationID: ID!): [OrganizationContactLastMailed!]!
  organizationMailingPreview(organizationID: ID!, segment: MailingSegmentInput): OrganizationMailingPreview!

  """Horaires d'ouverture (membres de l'organisation)."""
  organizationBusinessHours(organizationID: ID!): OrganizationBusinessHours!
  organization(organizationID: ID!, admin: Boolean): Organization
  organizations(pagination: PaginationInput, sort: SortInput, filter: [FilterInput!], admin: Boolean): [Organization!]!
  organizationsByIDs(organizationIDs: [ID!]!, admin: Boolean): [Organization!]!
  organizationsBySlugs(slugs: [String!]!, admin: Boolean): [Organization!]!
  organizationByUniqRef(uniqRef: String!, admin: Boolean): Organization
  organizationBySlug(slug: String!, admin: Boolean): Organization
  orgPaymentMethod(paymentMethodID: ID!): OrgPaymentMethod!
  orgPaymentMethods(organizationID: ID!, kind: String): [OrgPaymentMethod!]!
  userOrganization(userOrganizationID: ID!): UserOrganization
  userOrganizations(pagination: PaginationInput, sort: SortInput, filter: [FilterInput!]): [UserOrganization!]!
  userOrganizationBySlug(slug: String!): UserOrganization
  userOrganizationsByIDs(userOrganizationIDs: [ID!]!, pagination: PaginationInput, sort: SortInput, filter: [FilterInput!]): [UserOrganization!]!
  userOrganizationsBySlugs(slugs: [String!]!, pagination: PaginationInput, sort: SortInput, filter: [FilterInput!]): [UserOrganization!]!
  userOrganizationByUniqRefs(uniqRefs: [String!]!, pagination: PaginationInput, sort: SortInput, filter: [FilterInput!]): UserOrganization
  userOrganizationByUniqRef(uniqRef: String!): UserOrganization
  listOrganizationMembers(organizationID: ID!): OrganizationMembersResponse!
  getUserOrganizations(userID: ID!): [OrganizationsByUserResponse!]!
  isUserInOrganization(userID: ID!, organizationID: ID!): Boolean!
  verifyUserRole(input: VerifyUserRoleInput!): VerifyUserRoleResponse!
  searchUsers(query: String!, limit: Float = 10): [SearchUsersResult!]!
  getMemberProfile(organizationID: ID!, userID: ID!): MemberProfileResponse!
  memberCapacities(organizationID: ID!): [MemberCapacity!]!
}

input MailingSegmentInput {
  statuses: [OrgContactStatus!]

  """Au moins une de ces étiquettes."""
  tags: [String!]

  """Contacts choisis un par un."""
  contactIDs: [ID!]
}

input PaginationInput {
  page: Int
  pageSize: Int
  offset: Int
  limit: Int
}

input SortInput {
  field: String
  order: String
}

input FilterInput {
  field: String!
  operator: String!
  value: String!
}

input VerifyUserRoleInput {
  userID: ID!
  organizationID: ID!
}

type Mutation {
  createOrganizationContact(input: CreateContactInput!): OrganizationContact!
  updateOrganizationContact(contactID: ID!, input: UpdateContactInput!, callerUserID: ID @deprecated(reason: "Ignoré : l'appelant est l'identité signée de la requête.")): OrganizationContact!
  deleteOrganizationContact(contactID: ID!, callerUserID: ID @deprecated(reason: "Ignoré : l'appelant est l'identité signée de la requête.")): MutationResponse!
  bulkCreateOrganizationContacts(organizationID: ID!, contacts: [BulkContactInput!]!, callerUserID: ID @deprecated(reason: "Ignoré : l'appelant est l'identité signée de la requête.")): BulkCreateContactsResponse!
  setOrganizationContactPrivacy(contactID: ID!, isPrivate: Boolean!, callerUserID: ID @deprecated(reason: "Ignoré : l'appelant est l'identité signée de la requête.")): OrganizationContact!
  assignOrganizationContact(input: AssignOrganizationContactInput!): OrganizationContact!
  handOverOrganizationContact(input: HandOverOrganizationContactInput!): OrganizationContact!
  bulkUpdateOrganizationContacts(input: BulkUpdateOrganizationContactsInput!): BulkUpdateOrganizationContactsResult!
  updateOrganizationDocumentSettings(organizationID: ID!, settings: JSON!): OrganizationDocumentSettings!
  resetOrganizationDocumentSettings(organizationID: ID!): OrganizationDocumentSettings!
  sendOrganizationMailing(input: SendOrganizationMailingInput!): OrganizationMailing!

  """
  Désinscription d’un contact (lien signé de l’e-mail). Réservé aux services internes.
  """
  unsubscribeOrganizationContactFromMailing(organizationID: ID!, contactID: ID!): Boolean!

  """Règle les horaires d'ouverture (propriétaire, administrateur)."""
  updateOrganizationBusinessHours(input: UpdateOrganizationBusinessHoursInput!): OrganizationBusinessHours!
  createOrganization(input: OrganizationInput!): Organization!
  updateOrganization(organizationID: ID!, input: OrganizationInput!): Organization!
  deleteOrganization(organizationID: ID!): Organization!
  createOrganizationMedia(input: CreateOrganizationMediaInput!): OrganizationMedia!
  updateOrganizationMedia(organizationMediaID: ID!, input: UpdateOrganizationMediaInput!): OrganizationMedia!
  deleteOrganizationMedia(organizationMediaID: ID!): MutationResponse!
  createOrgPaymentMethod(input: CreateOrgPaymentMethodInput!): OrgPaymentMethod!
  updateOrgPaymentMethod(paymentMethodID: ID!, input: UpdateOrgPaymentMethodInput!): OrgPaymentMethod!
  deleteOrgPaymentMethod(paymentMethodID: ID!): Boolean!
  createUserOrganization(input: CreateUserOrganizationInput!): UserOrganization!
  updateUserOrganization(userOrganizationID: ID!, input: UpdateUserOrganizationInput!): UserOrganization!
  deleteUserOrganization(userOrganizationID: ID!): MutationResponse!
  inviteUserToOrganization(input: InviteUserToOrganizationInput!): InviteUserToOrganizationResponse!
  addUserToOrganization(input: AddUserToOrganizationInput!): AddUserToOrganizationResponse!
  removeUserFromOrganization(input: RemoveUserFromOrganizationInput!): RemoveUserFromOrganizationResponse!
  updateUserRoleInOrganization(input: UpdateUserRoleInOrganizationInput!): UpdateUserRoleInOrganizationResponse!
  verifyInvitationToken(input: VerifyInvitationTokenInput!): InvitationVerificationResponse!
  removeInvitation(input: RemoveInvitationInput!): RemoveInvitationResponse!
  updateMemberProfile(input: UpdateMemberProfileInput!): MemberProfileResponse!
  resendInvitation(input: ResendInvitationInput!): ResendInvitationResponse!
  initiateOwnerTransfer(input: InitiateOwnerTransferInput!): OwnerTransferResponse!
  validateOwnerTransfer(input: ValidateOwnerTransferInput!): OwnerTransferResponse!
}

