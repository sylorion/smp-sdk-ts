type OrganizationTask {
  taskID: ID!
  organizationID: ID!
  title: String!
  description: String
  status: OrganizationTaskStatus!
  priority: OrganizationTaskPriority!
  creatorUserID: ID!
  assigneeUserID: ID
  dueAt: DateTime
  blockedReason: String
  blockedByTaskID: ID
  documentType: String
  documentID: ID
  labels: [String!]!
  position: Int!
  completedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum OrganizationTaskStatus {
  todo
  in_progress
  blocked
  done
  cancelled
}

enum OrganizationTaskPriority {
  low
  normal
  high
  urgent
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

