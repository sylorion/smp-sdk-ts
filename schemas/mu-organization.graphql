}

"""Envoi groupé d'un e-mail aux contacts de l'organisation (historique)."""
type OrganizationMailing {
  mailingID: ID!
  subject: String!

  """Début du message (200 caractères)."""
  excerpt: String!
  sentAt: String!
  actorUserID: ID!
  recipientCount: Int!

  """
  `queued` (en cours de traitement), `sent` (remis au service d’envoi) ou `failed`.
  """
