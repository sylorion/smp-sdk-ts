  """Campagne d’origine."""
  campaignID: ID

  """E-mails remis au service d’envoi (compte rendu de mu-notification)."""
  delivered: Int
  failedCount: Int
}

"""Destinataires que toucherait un envoi, avant de l’envoyer."""
type OrganizationMailingPreview {
  recipientCount: Int!

  """Contacts écartés parce qu’ils se sont désabonnés."""
  excludedOptOut: Int!

  """Contacts écartés faute d’adresse e-mail valide."""
  excludedNoEmail: Int!

  """Adresses en double (un seul envoi par adresse)."""
  duplicates: Int!

  """Quelques noms de destinataires."""
  sample: [String!]!
  maxRecipients: Int!

  """Envois encore possibles sur 24 heures."""
  remainingToday: Int!
}

"""
Plage d'ouverture d'un jour. Une fin avant le début : la plage finit le lendemain (nuit).
"""
type BusinessHoursRangeView {
  """1 = lundi … 7 = dimanche."""
  isoDay: Int!

  """HH:mm"""
  start: String!

  """HH:mm (24:00 accepté)."""
  end: String!
}

"""
Horaires d'ouverture de l'organisation (agenda, créneaux proposés par IRO).
"""
type OrganizationBusinessHours {
  organizationID: ID!

  """Faux : jamais réglés, l’agenda garde son horaire par défaut."""
