  sendWorkReportNotification(data: SendWorkReportNotificationInput!): Boolean!
  createOrder(input: CreateOrderInput!): Order!
  confirmOrder(orderId: String!): Order!
  addLine(orderId: String!, input: AddLineInput!): Order!
  markOrderPaid(orderId: String!): Order!
  markOrderDelivered(orderId: String!): Order!
  cancelOrder(orderId: String!): Order!
  createInternalProject(input: CreateInternalProjectInput!): InternalProject!
  updateInternalProject(projectId: ID!, input: UpdateInternalProjectInput!): InternalProject!
  addProjectActivity(input: AddProjectActivityInput!): InternalProject!
  updateProjectActivity(activityId: ID!, input: UpdateProjectActivityInput!): InternalProject!

  """
  Démarrer, terminer, mettre en pause, annuler ou rouvrir une activité. Un livrable se termine après dépôt, par le responsable du projet.
  """
  projectActivityAction(input: ProjectActivityActionInput!): InternalProject!

  """
  Décale l'échéance d'une activité (responsable du projet) ; les activités suivantes sont poussées en cascade.
  """
  shiftProjectActivity(input: ShiftProjectActivityInput!): InternalProject!

  """
  Temps alloué : set, propose, ask, accept, counter, acceptCounter, keep, nudge.
  """
  projectActivityTime(input: ProjectActivityTimeInput!): InternalProject!

  """Signale une difficulté (une seule ouverte par activité)."""
  reportActivityIssue(input: ReportActivityIssueInput!): InternalProject!

  """Résout une difficulté ; peut accepter la nouvelle échéance proposée."""
  resolveActivityIssue(input: ResolveActivityIssueInput!): InternalProject!

  """
  Dépose le livrable d'une activité de type livrable (remplace le précédent).
  """
  depositActivityDeliverable(input: DepositActivityDeliverableInput!): InternalProject!

  """
  Valide le livrable déposé (responsable du projet) : termine l’activité.
  """
  validateActivityDeliverable(activityId: ID!): InternalProject!

  """Crée un lien de partage ; le jeton n’est renvoyé que cette fois."""
