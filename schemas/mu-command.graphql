  updateEngagementReport(engagementReportId: String!, data: UpdateEngagementReportInput!): EngagementReport!
  deleteTimeSlot(timeSlotId: String!): TimeSlot!
  deleteEngagementReport(engagementReportId: String!): EngagementReport!
  deleteEngagement(engagementId: String!): Engagement!
