  serviceId: ID!
  estimateId: ID!
  transactionId: ID!
  sellerOrganizationId: ID!
  buyerOrganizationId: ID
  currency: ID
  totalPrice: Float!
  billingInformation: JSON
  flowRunId: ID
  referralToken: String
}

input AddLineInput {
  orderAssetId: ID!
  assetId: ID!
  quantity: Int!
  unitPrice: Int!
  title: String!
  description: String!
  legalVatPercent: Int!
  details: String!
}

input ReferralOfferInput {
  enabled: Boolean!
  commissionRate: Float!
  approvalMode: String!
  terms: String
  attributionDays: Int
}

input RequestReferralPartnershipInput {
  serviceId: ID!
  apporteurOrganizationId: ID!
  message: String
  acceptMandate: Boolean!
}

input CreateWeeklyAvailabilityBatchInput {
  serviceId: String!
  userId: String!
  slots: [WeeklyAvailabilityInput!]!
  replaceExisting: Boolean! = false
}

input WeeklyAvailabilityInput {
  dayOfWeek: Int!
  startTime: String!
  endTime: String!
}

input CreateAvailabilityExceptionInput {
  serviceId: String!
  userId: String!
  exceptionStartDate: DateTime!
  exceptionEndDate: DateTime
  startTime: String!
  endTime: String!
}

input CreateServiceFlowInput {
  organizationId: ID!
  name: String!
  description: String
  definition: JSON
  createdByAgent: Boolean
}

input UpdateServiceFlowInput {
  name: String
  description: String
  definition: JSON
}

input StartServiceFlowRunInput {
  serviceId: ID!
  amount: Int
  currency: String
  options: JSON
  buyerName: String
  buyerEmail: String
  buyerCompany: String
  buyerOrganizationId: ID
}

input ValidateServiceFlowRunInput {
  signerUserId: ID
  applyStamp: Boolean
}

input RequestServiceFlowChangesInput {
  stepKey: ID!
  itemKey: String
  message: String!
}