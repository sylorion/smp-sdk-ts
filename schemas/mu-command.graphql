  publishServiceFlow(flowId: ID!): ServiceFlow!
  duplicateServiceFlow(flowId: ID!): ServiceFlow!
  archiveServiceFlow(flowId: ID!): ServiceFlow!
  deleteServiceFlow(flowId: ID!): Boolean!
  linkServiceFlow(flowId: ID!, serviceId: ID!): ServiceFlow!
  unlinkServiceFlow(serviceId: ID!): Boolean!
  startServiceFlowRun(data: StartServiceFlowRunInput!): ServiceFlowRun!
  saveServiceFlowStep(runId: ID!, stepKey: ID!, data: JSON!): ServiceFlowRun!
  completeServiceFlowStep(runId: ID!, stepKey: ID!, data: JSON): ServiceFlowRun!
  prepareServiceFlowContract(runId: ID!, stepKey: ID!): ServiceFlowContractPreparation!
  editServiceFlowRunAnswers(runId: ID!): ServiceFlowRun!
  restartServiceFlowRun(runId: ID!): ServiceFlowRun!
  postServiceFlowRunMessage(runId: ID!, message: String!): ServiceFlowRun!
  completeServiceFlowServiceStep(runId: ID!, stepKey: ID!, data: JSON!): ServiceFlowRun!
  validateServiceFlowRun(runId: ID!, data: ValidateServiceFlowRunInput): ServiceFlowRun!
  requestServiceFlowChanges(runId: ID!, data: RequestServiceFlowChangesInput!): ServiceFlowRun!
  refuseServiceFlowRun(runId: ID!, reason: String!): ServiceFlowRun!
  relaunchServiceFlowRun(runId: ID!): ServiceFlowRun!

  """
